[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "populis_api"
version = "0.1.0"
description = "Populis Protocol API — vault registration, coinset.org broker, EIP-712 pubkey recovery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "Matthew S. Hintz" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "eth-utils>=4",
    "eth-account>=0.13",
    "eth-keys>=0.5",
    "pycoin>=0.92",
    "pycryptodome>=3.20",
    "python-dotenv>=1.0",
    # Populis protocol (local path install)
    # Use: pip install -e ../populis_protocol
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx[cli]>=0.27"]

[tool.setuptools.packages.find]
include = ["populis_api*"]
