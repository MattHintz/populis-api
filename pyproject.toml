[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solslot-api"
version = "0.1.0"
description = "Solslot protocol API for vaults, credentials, and ceremony operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "Matthew S. Hintz" }]
dependencies = [
    "fastapi>=0.139.2",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "eth-utils>=4",
    "eth-account>=0.13",
    "eth-keys>=0.5",
    "pycryptodome>=3.20",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.13.0",
    "web3>=7,<8",
    # Solslot protocol (local path install)
    # Use: pip install -e ../solslot-protocol
]

[project.optional-dependencies]
dev = [
    "httpx[cli]>=0.27",
    "pip-audit>=2.10.1",
    # chia-puzzles-py 0.20.3 still constrains pytest<9; see CI audit waiver.
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.3,<1.4",
]

[tool.setuptools.packages.find]
include = ["solslot_api*"]
