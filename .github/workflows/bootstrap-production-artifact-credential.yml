name: Bootstrap Production Artifact Credential

on:
  workflow_dispatch:
    inputs:
      action_envelope:
        description: "Exact approved ActionEnvelope identifier."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: solslot-api-production
  cancel-in-progress: false

env:
  RELEASE_ROOT: ${{ vars.SOLSLOT_API_RELEASE_ROOT || '/opt/solslot/api-production' }}
  ENV_FILE_PATH: ${{ vars.SOLSLOT_API_ENV_FILE_PATH || '/opt/solslot/api-production/shared/.env' }}
  SYSTEMD_SERVICE: ${{ vars.SOLSLOT_API_SYSTEMD_SERVICE || 'solslot-api-production.service' }}
  SYSTEMD_USER: ${{ vars.SOLSLOT_API_SYSTEMD_USER || 'solslot-api' }}
  EXPECTED_HOSTNAME: ${{ vars.SOLSLOT_API_HOSTNAME || 'SolomonsLot' }}
  PUBLIC_BASE_URL: https://solslot.com/protocol-api

jobs:
  bootstrap-credential:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require the approved ActionEnvelope
        shell: bash
        env:
          ACTION_ENVELOPE: ${{ inputs.action_envelope }}
        run: |
          set -euo pipefail
          test "$ACTION_ENVELOPE" = \
            "AE-SOLSLOT-RC27.6-API-PRODUCTION-ARTIFACT-CREDENTIAL-20260821-07"

      - name: Create the missing server credential on the production host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PRODUCTION_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail

            release_root="${{ env.RELEASE_ROOT }}"
            env_file="${{ env.ENV_FILE_PATH }}"
            systemd_service="${{ env.SYSTEMD_SERVICE }}"
            systemd_user="${{ env.SYSTEMD_USER }}"
            expected_hostname="${{ env.EXPECTED_HOSTNAME }}"
            backup_root="$release_root/credential-backups"
            backup_file="$backup_root/.env.before-artifact-token-${{ github.run_id }}"

            actual_hostname="$(hostname)"
            if [ "$actual_hostname" != "$expected_hostname" ]; then
              echo "Refusing credential bootstrap on unexpected host." >&2
              exit 1
            fi
            sudo test -f "$env_file"
            id "$systemd_user" >/dev/null 2>&1
            sudo systemctl is-active --quiet "$systemd_service"
            sudo install -d -o root -g root -m 0700 "$backup_root"

            sudo env \
              ENV_FILE_PATH="$env_file" \
              BACKUP_FILE_PATH="$backup_file" \
              SYSTEMD_USER="$systemd_user" \
              python3 - <<'PY'
            import os
            import pwd
            import secrets
            import shutil
            import stat
            import tempfile
            from pathlib import Path

            key = "SOLSLOT_PROTOCOL_ARTIFACT_API_TOKEN"
            prefix = f"{key}="
            env_file = Path(os.environ["ENV_FILE_PATH"])
            backup_file = Path(os.environ["BACKUP_FILE_PATH"])
            service_account = pwd.getpwnam(os.environ["SYSTEMD_USER"])

            if env_file.is_symlink() or not env_file.is_file():
                raise SystemExit("production environment path must be a regular file")

            lines = env_file.read_text(encoding="utf-8").splitlines(keepends=True)
            indexes = [index for index, line in enumerate(lines) if line.startswith(prefix)]
            if len(indexes) > 1:
                raise SystemExit("duplicate protocol artifact credential entries")

            def decoded_value(line: str) -> str:
                value = line[len(prefix):].strip()
                if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
                    value = value[1:-1]
                return value

            existing = decoded_value(lines[indexes[0]]) if indexes else ""
            created = len(existing) < 32

            if created:
                if backup_file.exists():
                    raise SystemExit("rollback backup already exists")
                shutil.copy2(env_file, backup_file, follow_symlinks=False)
                os.chown(backup_file, 0, 0)
                os.chmod(backup_file, 0o600)

                token = secrets.token_hex(32)
                replacement = f"{prefix}{token}\n"
                if indexes:
                    lines[indexes[0]] = replacement
                else:
                    if lines and not lines[-1].endswith("\n"):
                        lines[-1] += "\n"
                    lines.append(replacement)

                file_descriptor, temporary_name = tempfile.mkstemp(
                    prefix=".env.artifact-credential.",
                    dir=env_file.parent,
                    text=True,
                )
                temporary_path = Path(temporary_name)
                try:
                    with os.fdopen(file_descriptor, "w", encoding="utf-8") as handle:
                        handle.writelines(lines)
                        handle.flush()
                        os.fsync(handle.fileno())
                    os.chown(
                        temporary_path,
                        service_account.pw_uid,
                        service_account.pw_gid,
                    )
                    os.chmod(temporary_path, 0o600)
                    os.replace(temporary_path, env_file)
                    directory_descriptor = os.open(env_file.parent, os.O_RDONLY)
                    try:
                        os.fsync(directory_descriptor)
                    finally:
                        os.close(directory_descriptor)
                finally:
                    if temporary_path.exists():
                        temporary_path.unlink()

            final_lines = env_file.read_text(encoding="utf-8").splitlines()
            final_entries = [line for line in final_lines if line.startswith(prefix)]
            if len(final_entries) != 1 or len(decoded_value(final_entries[0])) < 32:
                raise SystemExit("protocol artifact credential validation failed")

            final_stat = env_file.stat()
            if stat.S_IMODE(final_stat.st_mode) != 0o600:
                raise SystemExit("production environment permissions are not 0600")
            if final_stat.st_uid != service_account.pw_uid:
                raise SystemExit("production environment owner is not the service account")
            if created:
                backup_stat = backup_file.stat()
                if stat.S_IMODE(backup_stat.st_mode) != 0o600:
                    raise SystemExit("rollback backup permissions are not 0600")
                if backup_stat.st_uid != 0 or backup_stat.st_gid != 0:
                    raise SystemExit("rollback backup is not root-owned")

            print(f"credential_state={'created' if created else 'already-valid'}")
            print(f"rollback_backup={'created' if created else 'not-required'}")
            print("credential_validation=ok")
            PY

            sudo systemctl is-active --quiet "$systemd_service"

      - name: Verify production remained on the rollback release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${{ env.PUBLIC_BASE_URL }}/release" \
            | python -c 'import json, sys; data=json.load(sys.stdin); release=data["release"]; assert data["available"] is True; assert release["apiCommit"] == "d34bbc11accd698890a7a3933d3dcf136e69c75d"; assert release["protocolCommit"] == "b1e749b19b362e301b7e7a624e1ea367fb241e33"'
