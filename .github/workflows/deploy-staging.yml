name: Staging Backend Deploy

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Inspect the live staging API without deploying a release."
        required: false
        type: boolean
        default: false
      rollback_sha:
        description: "Existing release SHA to roll back to. Leave blank for a normal deploy."
        required: false
        type: string
      bridge_pool_topup_count:
        description: "Optional: create this many zkPassport bridge coins after deploy."
        required: false
        type: string
      bridge_pool_topup_start_amount:
        description: "First bridge coin amount in mojos when bridge_pool_topup_count is set."
        required: false
        default: "1"
        type: string
      bridge_pool_topup_dry_run:
        description: "Preview bridge pool top-up without pushing to Coinset."
        required: false
        type: boolean
        default: true
  push:
    branches:
      - staging

concurrency:
  group: solslot-api-staging
  cancel-in-progress: false

env:
  RELEASE_ROOT: ${{ vars.SOLSLOT_API_RELEASE_ROOT || '/opt/solslot/api-staging' }}
  SHARED_ROOT: ${{ vars.SOLSLOT_API_SHARED_ROOT || '/opt/solslot/api-staging/shared' }}
  ENV_FILE_PATH: ${{ vars.SOLSLOT_API_ENV_FILE_PATH || '/opt/populis-api-staging/.env' }}
  SYSTEMD_SERVICE: ${{ vars.SOLSLOT_API_SYSTEMD_SERVICE || 'populis-api-staging.service' }}
  APP_PORT: ${{ vars.SOLSLOT_API_PORT || '8790' }}
  PUBLIC_BASE_URL: https://staging.solslot.com/protocol-api
  EXPECTED_HOSTNAME: ${{ vars.SOLSLOT_API_HOSTNAME || 'SolomonsLot' }}
  PROTOCOL_REPOSITORY: MattHintz/solslot-protocol
  PROTOCOL_REF: ${{ vars.SOLSLOT_PROTOCOL_REF || 'main' }}
  ZKPASSPORT_BRIDGE_PARENT_IDS: ${{ vars.SOLSLOT_ZKPASSPORT_BRIDGE_PARENT_IDS || vars.POPULIS_ZKPASSPORT_BRIDGE_PARENT_IDS || '' }}

jobs:
  build-release:
    if: ${{ (github.event.inputs.diagnostics_only != 'true') && (github.event.inputs.rollback_sha == '' || github.event.inputs.rollback_sha == null) }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout API
        uses: actions/checkout@v4

      - name: Checkout protocol package
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCOL_REPOSITORY }}
          ref: ${{ env.PROTOCOL_REF }}
          path: protocol

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Detect app package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [ -d solslot_api ]; then
            package_name=solslot_api
          elif [ -d populis_api ]; then
            package_name=populis_api
          else
            echo "No solslot_api or populis_api package directory found." >&2
            exit 1
          fi
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "app_module=$package_name.app:app" >> "$GITHUB_OUTPUT"

      - name: Install and test
        shell: bash
        env:
          APP_PACKAGE: ${{ steps.package.outputs.package_name }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install -e protocol -e '.[dev]'
          python -m compileall -q "$APP_PACKAGE"
          python - <<'PY'
          import importlib
          import os
          package = os.environ["APP_PACKAGE"]
          module = importlib.import_module(f"{package}.app")
          app = module.app
          paths = app.openapi().get("paths", {})
          assert "Solslot" in app.title, app.title
          assert any("zkpassport/enrollments" in path for path in paths), paths.keys()
          PY
          if [ -f tests/test_zkpassport_enrollments.py ]; then
            pytest tests/test_zkpassport_enrollments.py -q
          fi

      - name: Secret scan
        shell: bash
        env:
          APP_PACKAGE: ${{ steps.package.outputs.package_name }}
        run: |
          set -euo pipefail
          pattern='sk_(live|test)_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|MANDRILL_API_KEY=|STRIPE_SECRET_KEY=|BEGIN (RSA|EC|OPENSSH|PRIVATE)'
          if grep -R -n -E "$pattern" "$APP_PACKAGE" tests .github --exclude="*.yml" --exclude="*.yaml"; then
            echo "Secret-like value found in API source, tests, or workflows."
            exit 1
          fi

      - name: Write release metadata
        shell: bash
        env:
          APP_PACKAGE: ${{ steps.package.outputs.package_name }}
          APP_MODULE: ${{ steps.package.outputs.app_module }}
        run: |
          set -euo pipefail
          protocol_commit="$(git -C protocol rev-parse HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - <<PY
          import json
          data = {
              "api_commit": "${GITHUB_SHA}",
              "api_repository": "${GITHUB_REPOSITORY}",
              "protocol_repository": "${PROTOCOL_REPOSITORY}",
              "protocol_ref": "${PROTOCOL_REF}",
              "protocol_commit": "${protocol_commit}",
              "built_at_utc": "${built_at}",
              "package_name": "${APP_PACKAGE}",
              "app_module": "${APP_MODULE}",
          }
          with open("release.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

      - name: Package release
        shell: bash
        env:
          APP_PACKAGE: ${{ steps.package.outputs.package_name }}
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.pytest_cache' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='*.pyc' \
            -czf "solslot-api-release-${GITHUB_SHA}.tgz" \
            "$APP_PACKAGE" \
            protocol \
            pyproject.toml \
            README.md \
            release.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: solslot-api-release-${{ github.sha }}
          path: solslot-api-release-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Copy release to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          port: 22
          source: solslot-api-release-${{ github.sha }}.tgz
          target: /tmp
          rm: false

  deploy-release:
    needs: build-release
    if: ${{ github.event.inputs.rollback_sha == '' || github.event.inputs.rollback_sha == null }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy release atomically
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail

            release_root="${{ env.RELEASE_ROOT }}"
            release_sha="${{ github.sha }}"
            release_dir="$release_root/releases/$release_sha"
            archive="/tmp/solslot-api-release-$release_sha.tgz"
            shared_root="${{ env.SHARED_ROOT }}"
            state_dir="$shared_root/state"
            env_file="${{ env.ENV_FILE_PATH }}"
            systemd_service="${{ env.SYSTEMD_SERVICE }}"
            app_port="${{ env.APP_PORT }}"
            zkpassport_bridge_parent_ids="${{ env.ZKPASSPORT_BRIDGE_PARENT_IDS }}"
            zkpassport_bridge_parent_env_lines=""
            actual_hostname="$(hostname)"
            if [ "$actual_hostname" != "${{ env.EXPECTED_HOSTNAME }}" ]; then
              echo "Refusing staging deploy: expected host ${{ env.EXPECTED_HOSTNAME }}, got $actual_hostname" >&2
              exit 1
            fi
            if [ -n "$zkpassport_bridge_parent_ids" ]; then
              zkpassport_bridge_parent_env_lines="$(printf 'Environment=POPULIS_ZKPASSPORT_BRIDGE_PARENT_IDS=%s\nEnvironment=SOLSLOT_ZKPASSPORT_BRIDGE_PARENT_IDS=%s' "$zkpassport_bridge_parent_ids" "$zkpassport_bridge_parent_ids")"
            fi

            sudo mkdir -p "$release_root/releases" "$state_dir"
            sudo chown -R "$(id -un)":"$(id -gn)" "$release_root" "$shared_root"
            test -f "$archive" || (echo "Missing release archive $archive" && exit 1)
            sudo test -f "$env_file" || (echo "Missing $env_file on staging host." && exit 1)

            rm -rf "$release_dir"
            mkdir -p "$release_dir"
            tar -xzf "$archive" -C "$release_dir"

            cd "$release_dir"
            python_bin="$(command -v python3.12 || command -v python3.11 || true)"
            if [ -z "$python_bin" ]; then
              echo "Python 3.11+ is required on the staging host."
              exit 1
            fi
            "$python_bin" - <<'PY'
            import sys
            if sys.version_info < (3, 11):
                raise SystemExit(f"Python 3.11+ is required, found {sys.version}")
            PY
            package_name="$("$python_bin" -c 'import json; print(json.load(open("release.json"))["package_name"])')"
            app_module="$("$python_bin" -c 'import json; print(json.load(open("release.json"))["app_module"])')"
            "$python_bin" -m venv .venv
            .venv/bin/python -m pip install --upgrade pip wheel
            .venv/bin/python -m pip install -e ./protocol .
            .venv/bin/python -m compileall -q "$package_name"
            .venv/bin/python - <<PY
            import importlib
            module_name = "${app_module}".split(":")[0]
            app = importlib.import_module(module_name).app
            paths = app.openapi().get("paths", {})
            assert "Solslot" in app.title, app.title
            assert any("zkpassport/enrollments" in path for path in paths), paths.keys()
            PY

            ln -sfn "$release_dir" "$release_root/current"
            sudo mkdir -p /etc/systemd/system/"$systemd_service".d
            sudo tee /etc/systemd/system/"$systemd_service".d/solslot-staging.conf >/dev/null <<EOF
            [Service]
            WorkingDirectory=$release_root/current
            EnvironmentFile=$env_file
            Environment=PYTHONUNBUFFERED=1
            Environment=POPULIS_ZKPASSPORT_ENROLLMENT_STORE_PATH=$state_dir/zkpassport_enrollments.json
            Environment=SOLSLOT_ZKPASSPORT_ENROLLMENT_STORE_PATH=$state_dir/zkpassport_enrollments.json
            Environment=POPULIS_ZKPASSPORT_BRIDGE_AUTO_TOPUP_ENABLED=true
            Environment=SOLSLOT_ZKPASSPORT_BRIDGE_AUTO_TOPUP_ENABLED=true
            $zkpassport_bridge_parent_env_lines
            ExecStart=
            ExecStart=$release_root/current/.venv/bin/uvicorn $app_module --host 127.0.0.1 --port $app_port
            ReadWritePaths=$shared_root $release_root
            EOF
            sudo systemctl daemon-reload
            sudo systemctl restart "$systemd_service"

            sleep 5
            curl -fsS "http://127.0.0.1:$app_port/health"
            curl -fsS "http://127.0.0.1:$app_port/openapi.json" \
              | "$release_dir/.venv/bin/python" -c 'import json, sys; data = json.load(sys.stdin); assert "Solslot" in data.get("info", {}).get("title", ""), data.get("info"); assert any("zkpassport/enrollments" in path for path in data.get("paths", {}))'

            find "$release_root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | awk 'NR>5 {print $2}' \
              | xargs -r rm -rf

      - name: Verify public staging API
        run: |
          set -euo pipefail
          curl -fsS "${{ env.PUBLIC_BASE_URL }}/health"
          curl -fsS "${{ env.PUBLIC_BASE_URL }}/openapi.json" \
            | python -c 'import json, sys; data = json.load(sys.stdin); assert "Solslot" in data.get("info", {}).get("title", ""), data.get("info"); assert any("zkpassport/enrollments" in path for path in data.get("paths", {}))'

      - name: Optional bridge pool top-up
        if: ${{ github.event.inputs.bridge_pool_topup_count != '' && github.event.inputs.bridge_pool_topup_count != null }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail

            env_file="${{ env.ENV_FILE_PATH }}"
            app_port="${{ env.APP_PORT }}"
            count="${{ github.event.inputs.bridge_pool_topup_count }}"
            start_amount="${{ github.event.inputs.bridge_pool_topup_start_amount }}"
            dry_run="${{ github.event.inputs.bridge_pool_topup_dry_run }}"

            case "$count" in
              ''|*[!0-9]*) echo "bridge_pool_topup_count must be numeric" >&2; exit 1 ;;
            esac
            case "$start_amount" in
              ''|*[!0-9]*) echo "bridge_pool_topup_start_amount must be numeric" >&2; exit 1 ;;
            esac

            test -f "$env_file" || (echo "Missing $env_file" >&2; exit 1)
            admin_token="$(ENV_FILE="$env_file" python3 - <<'PY'
            import os
            from pathlib import Path

            token = ""
            for raw in Path(os.environ["ENV_FILE"]).read_text(encoding="utf-8").splitlines():
                line = raw.strip()
                if not line or line.startswith("#") or "=" not in line:
                    continue
                key, value = line.split("=", 1)
                key = key.removeprefix("export ").strip()
                if key in {"SOLSLOT_ADMIN_TOKEN", "POPULIS_ADMIN_TOKEN"}:
                    token = value.strip().strip("'\"")
            print(token)
            PY
            )"
            test -n "$admin_token" || (echo "No admin token configured in $env_file" >&2; exit 1)

            body="$(python3 - <<PY
            import json
            print(json.dumps({
                "count": int("$count"),
                "start_amount": int("$start_amount"),
                "dry_run": "$dry_run".lower() == "true",
            }))
            PY
            )"

            curl -fsS \
              -X POST "http://127.0.0.1:${app_port}/admin/zkpassport/bridge-pool/top-up" \
              -H "authorization: Bearer ${admin_token}" \
              -H "content-type: application/json" \
              --data "$body" \
              | python3 -m json.tool

      - name: Print staging API diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          port: 22
          script: |
            set +e
            echo "user=$(id -un) home=$HOME"
            ps aux | grep -E 'uvicorn|solslot|populis_api' | grep -v grep
            sudo systemctl status "${{ env.SYSTEMD_SERVICE }}" --no-pager
            sudo journalctl -u "${{ env.SYSTEMD_SERVICE }}" -n 120 --no-pager
            curl -fsS "http://127.0.0.1:${{ env.APP_PORT }}/health" || true

  rollback:
    if: ${{ (github.event.inputs.diagnostics_only != 'true') && (github.event.inputs.rollback_sha != '' && github.event.inputs.rollback_sha != null) }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Roll back staging API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          port: 22
          script: |
            set -euo pipefail
            release_root="${{ env.RELEASE_ROOT }}"
            rollback_sha="${{ github.event.inputs.rollback_sha }}"
            release_dir="$release_root/releases/$rollback_sha"
            test -d "$release_dir" || (echo "No release directory exists for $rollback_sha" && exit 1)

            ln -sfn "$release_dir" "$release_root/current"
            sudo systemctl restart "${{ env.SYSTEMD_SERVICE }}"
            sleep 5
            curl -fsS "http://127.0.0.1:${{ env.APP_PORT }}/health"

      - name: Verify public rollback
        run: |
          set -euo pipefail
          curl -fsS "${{ env.PUBLIC_BASE_URL }}/health"
          curl -fsS "${{ env.PUBLIC_BASE_URL }}/openapi.json" >/dev/null

  runtime-diagnostics:
    if: ${{ github.event.inputs.diagnostics_only == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect live staging API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 5m
          script: |
            set +e
            echo "hostname=$(hostname) expected=${{ env.EXPECTED_HOSTNAME }}"
            echo "user=$(id -un) home=$HOME"
            echo "current=$(readlink -f '${{ env.RELEASE_ROOT }}/current')"
            sudo systemctl status "${{ env.SYSTEMD_SERVICE }}" --no-pager
            ps -eo pid,user,lstart,cmd | grep -E 'uvicorn .*populis_api|uvicorn .*solslot_api' | grep -v grep
            echo "--- recent API journal ---"
            sudo journalctl -u "${{ env.SYSTEMD_SERVICE }}" -n 300 --no-pager
            echo "--- local health ---"
            curl -fsS "http://127.0.0.1:${{ env.APP_PORT }}/health" || true
            echo
            echo "--- local OpenAPI routes ---"
            curl -fsS "http://127.0.0.1:${{ env.APP_PORT }}/openapi.json" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("info",{}).get("title")); [print(path) for path in sorted(d.get("paths",{})) if "zkpassport" in path]' \
              || true
            echo "--- vault registry candidates ---"
            sudo find /opt/solslot /opt/populis-api-staging -type f -name 'vault_registry.db' -print0 2>/dev/null \
              | while IFS= read -r -d '' db; do
                  sudo DB_PATH="$db" python3 - <<'PY'
            import os
            import sqlite3

            path = os.environ["DB_PATH"]
            try:
                connection = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
                count = connection.execute("SELECT count(*) FROM vaults").fetchone()[0]
                connection.close()
                print(f"{path} vaults={count}")
            except Exception as exc:
                print(f"{path} unreadable={exc}")
            PY
                done
            echo "--- shared state ---"
            sudo find "${{ env.SHARED_ROOT }}/state" -maxdepth 1 -type f -printf '%f bytes=%s modified=%TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null \
              | sort
