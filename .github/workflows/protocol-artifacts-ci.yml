name: Protocol Artifacts CI

on:
  pull_request:
  push:
    branches:
      - codex/solslot-protocol-artifacts

jobs:
  test-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout API
        uses: actions/checkout@v4

      - name: Checkout protocol package
        uses: actions/checkout@v4
        with:
          repository: MattHintz/populis-protocol
          path: populis-protocol

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e populis-protocol -e '.[dev]'

      - name: Protocol artifact tests
        run: pytest tests/test_protocol_artifacts.py

      - name: Public artifact secret scan
        shell: bash
        run: |
          pattern='sk_(live|test)_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|MANDRILL_API_KEY=|STRIPE_SECRET_KEY=|BEGIN (RSA|EC|OPENSSH|PRIVATE)'
          if grep -R -n -E "$pattern" populis_api tests; then
            echo "Secret-like value found in public API artifacts or tests."
            exit 1
          fi
