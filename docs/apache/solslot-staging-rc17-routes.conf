# Included inside the staging.solslot.com TLS VirtualHost.

RedirectMatch 302 ^/genesis-admin$ /genesis-admin/
Alias /genesis-admin/ /var/www/staging-solslot-admin-ceremony/current/
<Directory /var/www/staging-solslot-admin-ceremony/current>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteBase /genesis-admin/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.html [L]
    Header always set Cache-Control "no-store"
    Header always set Pragma "no-cache"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
</Directory>

ProxyPreserveHost On
ProxyPass /protocol-api/ http://127.0.0.1:8790/ connectiontimeout=5 timeout=30 retry=0
ProxyPassReverse /protocol-api/ http://127.0.0.1:8790/
<Location /protocol-api/>
    LimitRequestBody 4194304
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Host "expr=%{HTTP_HOST}"
    RequestHeader set X-Forwarded-Proto "https"
</Location>
